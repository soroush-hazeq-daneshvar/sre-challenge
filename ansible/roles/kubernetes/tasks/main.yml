---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes apt signing key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/ /
    filename: kubernetes
    state: present
    update_cache: true

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - kubelet={{ k8s_package_version }}
      - kubeadm={{ k8s_package_version }}
      - kubectl={{ k8s_package_version }}
    state: present
    allow_change_held_packages: true

- name: Get currently held packages
  ansible.builtin.command: apt-mark showhold
  register: apt_held_packages
  changed_when: false

- name: Hold Kubernetes packages
  ansible.builtin.command: apt-mark hold {{ item }}
  loop:
    - kubelet
    - kubeadm
    - kubectl
  when: item not in apt_held_packages.stdout_lines

- name: Enable kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
