stages:
  - validate
  - test
  - build
  - deploy

variables:
  GO_VERSION: "1.22"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/geoip-api"
  KUBERNETES_NAMESPACE: geoip

.validate_terraform:
  stage: validate
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check

validate_ansible:
  stage: validate
  image: cytopia/ansible-lint:latest
  script:
    - ansible-lint ansible/site.yml || true

lint_go:
  stage: validate
  image: golang:${GO_VERSION}-alpine
  script:
    - cd app/geoip-api
    - go vet ./...
    - go fmt ./...

test_go:
  stage: test
  image: golang:${GO_VERSION}-alpine
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: geoip_test
    POSTGRES_USER: geoip
    POSTGRES_PASSWORD: test
    DATABASE_URL: "postgres://geoip:test@postgres:5432/geoip_test?sslmode=disable"
  script:
    - cd app/geoip-api
    - go test -v -race -cover ./...

build_image:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd app/geoip-api
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHA -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
    - develop

deploy_staging:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  environment:
    name: staging
    url: https://geoip-staging.example.com
  script:
    - kubectl config use-context $KUBE_CONTEXT_STAGING
    - kubectl set image deployment/geoip-api geoip-api=$DOCKER_IMAGE:$CI_COMMIT_SHA -n $KUBERNETES_NAMESPACE
    - kubectl rollout status deployment/geoip-api -n $KUBERNETES_NAMESPACE --timeout=120s
  only:
    - develop

deploy_production:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  environment:
    name: production
    url: https://geoip.example.com
  script:
    - kubectl config use-context $KUBE_CONTEXT_PRODUCTION
    - kubectl set image deployment/geoip-api geoip-api=$DOCKER_IMAGE:$CI_COMMIT_SHA -n $KUBERNETES_NAMESPACE
    - kubectl rollout status deployment/geoip-api -n $KUBERNETES_NAMESPACE --timeout=120s
  when: manual
  only:
    - main

validate_k8s_manifests:
  stage: validate
  image:
    name: instrumenta/conftest:latest
    entrypoint: [""]
  script:
    - conftest test kubernetes/ --policy policies/ || true
