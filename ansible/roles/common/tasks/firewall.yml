---
- name: Allow SSH before enabling the firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow Kubernetes and Calico ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Allow cluster overlay and service CIDRs
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop: "{{ ufw_allowed_cidrs }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
