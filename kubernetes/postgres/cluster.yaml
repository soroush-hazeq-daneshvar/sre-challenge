apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: geoip-postgres
  namespace: postgres

spec:
  instances: 1

  bootstrap:
    initdb:
      database: geoip
      owner: geoip
      secret:
        name: geoip-postgres-credentials

  storage:
    size: 20Gi
    storageClass: local-path

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

---
apiVersion: v1
kind: Secret
metadata:
  name: geoip-postgres-credentials
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: geoip
  password: changeme-in-production