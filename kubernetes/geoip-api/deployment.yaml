apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoip-api
  namespace: geoip
  labels:
    app: geoip-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geoip-api
  template:
    metadata:
      labels:
        app: geoip-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: geoip-api
          image: registry.gitlab.com/sre-challenge/geoip-api:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: geoip-api-secrets
                  key: database-url
            - name: GEOIP_PROVIDER_URL
              value: "https://ipapi.co"
            - name: GEOIP_PROVIDER_TIMEOUT
              value: "5s"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: geoip-api
  namespace: geoip
  labels:
    app: geoip-api
spec:
  selector:
    app: geoip-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: geoip-api-secrets
  namespace: geoip
type: Opaque
stringData:
  database-url: "postgres://geoip:changeme-in-production@geoip-postgres-rw.postgres.svc:5432/geoip?sslmode=disable"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geoip-api
  namespace: geoip
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: geoip.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: geoip-api
                port:
                  number: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: geoip-api
  namespace: geoip
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: geoip-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

