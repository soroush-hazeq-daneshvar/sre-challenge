---
- name: Apply OS hardening
  ansible.builtin.import_tasks: hardening.yml
  tags: [hardening]

- name: Load required Kubernetes kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist required Kubernetes kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Persist Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {% for key, value in sysctl_settings.items() %}
      {{ key }} = {{ value }}
      {% endfor %}
  notify: Reload sysctl

- name: Check active swap
  ansible.builtin.command:
    cmd: swapon --show
  register: swap_status
  changed_when: false
  when: disable_swap

- name: Disable swap for the current boot
  ansible.builtin.command:
    cmd: swapoff -a
  when:
    - disable_swap
    - swap_status.stdout | length > 0

- name: Remove swap entries from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+)'
    state: absent
  when: disable_swap

- name: Configure UFW firewall
  ansible.builtin.import_tasks: firewall.yml
  when: enable_ufw
  tags: [firewall]
