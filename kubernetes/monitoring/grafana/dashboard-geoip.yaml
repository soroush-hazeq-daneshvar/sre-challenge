apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-geoip
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  geoip-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(geoip_http_requests_total[5m])) by (endpoint, status)",
              "legendFormat": "{{endpoint}} - {{status}}"
            }
          ]
        },
        {
          "title": "P95 Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(geoip_http_request_duration_seconds_bucket[5m])) by (le, endpoint))",
              "legendFormat": "{{endpoint}}"
            }
          ]
        },
        {
          "title": "Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "rate(geoip_cache_hits_total[5m]) / (rate(geoip_cache_hits_total[5m]) + rate(geoip_cache_misses_total[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "green", "value": 0.8 }
                ]
              }
            }
          }
        },
        {
          "title": "External API Calls",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(geoip_external_api_calls_total[5m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "title": "External API Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(geoip_external_api_duration_seconds_bucket[5m]))"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["geoip", "sre-challenge"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "GeoIP API Dashboard",
      "uid": "geoip-api",
      "version": 1
    }
