---
- name: Check whether this node has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Discover join credentials from the control plane
  when: not kubelet_conf.stat.exists
  block:
    - name: List existing kubeadm bootstrap tokens
      ansible.builtin.command: kubeadm token list
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: kubeadm_tokens
      changed_when: false

    - name: Create a bootstrap token when none exist
      ansible.builtin.command: kubeadm token create --ttl {{ join_token_ttl }}
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: kubeadm_token_create
      when: kubeadm_tokens.stdout_lines | length <= 1

    - name: Set the join token from a newly created token
      ansible.builtin.set_fact:
        k8s_join_token: "{{ kubeadm_token_create.stdout }}"
      when: kubeadm_tokens.stdout_lines | length <= 1

    - name: Set the join token from an existing bootstrap token
      ansible.builtin.set_fact:
        k8s_join_token: "{{ kubeadm_tokens.stdout_lines[1].split()[0] }}"
      when: kubeadm_tokens.stdout_lines | length > 1

    - name: Read the Kubernetes CA certificate hash
      ansible.builtin.shell: |
        set -o pipefail
        openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt \
          | openssl rsa -pubin -outform der 2>/dev/null \
          | openssl dgst -sha256 -hex \
          | awk '{print $2}'
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: k8s_ca_cert_hash
      changed_when: false

    - name: Join the node to the cluster
      ansible.builtin.command: >-
        kubeadm join {{ control_plane_endpoint }}
        --token {{ k8s_join_token }}
        --discovery-token-ca-cert-hash sha256:{{ k8s_ca_cert_hash.stdout }}
        --cri-socket {{ cri_socket }}
      args:
        creates: /etc/kubernetes/kubelet.conf
